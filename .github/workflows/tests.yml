name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: essential
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # the tests never reach Telegram, the token only has to parse
      BOT_TOKEN: '42:TEST'
      DB_NAME: essential
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      MONGO_HOST: localhost
      ADMIN_GROUP: '-1001'
      ADMIN_ID: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Load the schema and the demo words
        run: |
          psql -h localhost -U postgres -d essential -f db/schema.sql
          psql -h localhost -U postgres -d essential -f db/seed_demo.sql
        env:
          PGPASSWORD: postgres

      - run: pytest -q
